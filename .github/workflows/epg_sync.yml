name: Auto Sync EPG

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run EPG Builder
        run: python epg_builder.py

      - name: Commit and Push EPG Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg_lite.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto update EPG data"
          git push
